name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript", "typescript"]

    steps:
      # Using actions/checkout@v3 for latest features and security updates as recommended by GitHub.
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      # Using actions/setup-node@v5 for Node.js 20 support and improved caching.
      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 20

      # Using github/codeql-action/init@v4 for compatibility with current CodeQL workflows.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5d4e8d1aca955e8d8589aabd499c5cae939e33c7
        with:
          languages: ${{ matrix.language }}

      - name: Ensure package-lock.json exists and is up to date
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          else
            npm install --package-lock-only
          fi

      - name: Install dependencies
        run: npm ci

      # Upload SARIF results for further inspection (optional)
      - name: Upload CodeQL SARIF results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-sarif-results
          path: /home/runner/work/_temp/codeql_databases/**/results/*.sarif

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5d4e8d1aca955e8d8589aabd499c5cae939e33c7
