services:
  web:
    extends:
      file: ./docker/docker-compose.dev.yml
      service: web
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "if [ -f package-lock.json ]; then npm ci; else npm i; fi && npm run dev -- --host ${HOST:-0.0.0.0} --port ${PORT:-5173} --strictPort"
    ports:
      - "${PORT:-5173}:${PORT:-5173}"
    environment:
      - NODE_ENV=development

volumes:
  node_modules:
